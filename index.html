<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="SCOPE — a local-first student workspace for school, study and planning.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <title>SCOPE — Student workspace</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/app.js"></script>
</head>
<body>
  <div id="toast" class="toast"></div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">S</span><span>SCOPE</span></div>
      <div class="brand-sub">Students' SCOPE</div>
      <nav>
        <div class="nav-label">Home</div>
        <button class="nav-item active" data-view="dashboard"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-i18n="dashboard">Dashboard</span></button>
        <div class="nav-label">School</div>
        <button class="nav-item" data-view="subjects"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 5.5v15M7 7h9M7 11h9"/></svg><span data-i18n="subjects">Subjects</span></button>
        <button class="nav-item" data-view="grades"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/><path d="M3 20h18"/></svg><span data-i18n="grades">Grades</span></button>
        <button class="nav-item" data-view="exams"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v3h8V3M8 11h8M8 15h5"/></svg><span data-i18n="exams">Exams</span></button>
        <div class="nav-label">Study</div>
        <button class="nav-item" data-view="planner"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 9h16M8 13h3M8 17h6"/></svg><span data-i18n="planner">Planner</span></button>
        <button class="nav-item" data-view="focus"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2M12 2v2M12 20v2M2 12h2M20 12h2"/></svg><span data-i18n="focus">Focus</span></button>
        <button class="nav-item" data-view="quizzes"><svg viewBox="0 0 24 24"><path d="M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M8 9h8M8 13h5M8 17h3"/></svg><span data-i18n="quizzes">Quizzes</span></button>
        <div class="nav-label">Insights</div>
        <button class="nav-item" data-view="analytics"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/><path d="M3 20h18"/></svg><span data-i18n="analytics">Analytics</span></button>
        <button class="nav-item" data-view="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M7 2v4M17 2v4M3 9h18M7 13h3M7 17h6"/></svg><span data-i18n="calendar">Calendar</span></button>
        <div class="nav-label">System</div>
        <button class="nav-item" data-view="settings"><svg viewBox="0 0 24 24"><path d="M12 15.2A3.2 3.2 0 1 0 12 8.8a3.2 3.2 0 0 0 0 6.4z"/><path d="m19.4 15 .1.1a2 2 0 0 1-2.8 2.8l-.1-.1a2 2 0 0 0-3.4 1.4v.2a2 2 0 0 1-4 0v-.2A2 2 0 0 0 5.8 17.8l-.1.1a2 2 0 0 1-2.8-2.8l.1-.1A2 2 0 0 0 1.6 11.6h-.2a2 2 0 0 1 0-4h.2A2 2 0 0 0 3 4.2l-.1-.1A2 2 0 0 1 5.7 1.3l.1.1A2 2 0 0 0 9.2 0h.2a2 2 0 0 1 4 0v.2a2 2 0 0 0 3.4 1.4l.1-.1a2 2 0 0 1 2.8 2.8l-.1.1A2 2 0 0 0 21 7.6h.2a2 2 0 0 1 0 4H21a2 2 0 0 0-1.6 3.4z" transform="translate(1 1) scale(.92)"/></svg><span data-i18n="settings">Settings</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="local-status"><span class="status-dot"></span><div><strong data-i18n="localMode">Local mode</strong><small data-i18n="yourData">Your data stays in this browser.</small></div></div></div>
    </aside>
    <main class="main">
      <header class="mobile-header"><div class="brand"><span class="brand-mark">S</span>SCOPE</div><button class="icon-btn" id="mobileMenu" aria-label="Open navigation"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></header>
      <div id="app"></div>
    </main>
  </div>
  <div id="modal" class="modal-backdrop hidden"><div class="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" id="closeModal" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div id="modalBody"></div></div></div>
</body>
</html>
